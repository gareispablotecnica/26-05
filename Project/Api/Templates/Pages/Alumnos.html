{% extends 'Base.html' %}
{% load static %}

{% block Altamiran %}

<div class="contenedorAlumnos">
    {% for i in VerAlumnos %}
    <div class="cardJugador">

        {% if i.Imagen %}
            <img src="{{ i.Imagen.url }}" alt="Jugador">
        {% endif %}


        <h3>{{i.Apellido}}</h3>

        <p class="numero">{{i.DNI}}</p>

        <span>{{i.Nombre}}</span>

    </div>
    {% endfor %}
</div>

{% endblock %}
